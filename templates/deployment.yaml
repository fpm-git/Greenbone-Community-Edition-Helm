apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvas.fullname" . }}
  namespace: {{ template "openvas.namespace" . }}
  labels:
    {{- include "openvas.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "openvas.selectorLabels" . | nindent 6 }}
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openvas.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openvas.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{ if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      initContainers:
        - name: pg-init
          image: {{ .Values.psgvm.image.repository }}:{{ .Values.psgvm.image.tag }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "/init-scripts/init-postgres.sh"]
          env:
            - name: POSTGRES_VERSION
              value: "{{ .Values.psgvm.POSTGRES_VERSION }}"
          volumeMounts:
            - name: psql-storage
              mountPath: /mnt/postgresql
            - name: init-scripts
              mountPath: /init-scripts
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: notus-data
          image: registry.community.greenbone.net/community/notus-data
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt
              subPath: notus-data
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: scap-data
          image: registry.community.greenbone.net/community/scap-data
          imagePullPolicy: Always
          volumeMounts:
            - name: gvmd-storage
              mountPath: /mnt
              subPath: scap-data
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: cert-bund-data
          image: registry.community.greenbone.net/community/cert-bund-data
          imagePullPolicy: Always
          volumeMounts:
            - name: gvmd-storage
              mountPath: /mnt
              subPath: cert-data
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: dfn-cert-data
          image: registry.community.greenbone.net/community/dfn-cert-data
          imagePullPolicy: Always
          volumeMounts:
            - name: gvmd-storage
              mountPath: /mnt
              subPath: cert-data
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: data-objects
          image: registry.community.greenbone.net/community/data-objects
          imagePullPolicy: Always
          env:
            - name: FEED_RELEASE
              value: "{{ .Values.FEED_RELEASE }}"
          volumeMounts:
            - name: gvmd-storage
              mountPath: /mnt
              subPath: data-objects/gvmd
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: report-formats
          image: registry.community.greenbone.net/community/report-formats
          imagePullPolicy: Always
          env:
            - name: FEED_RELEASE
              value: "{{ .Values.FEED_RELEASE }}"
          volumeMounts:
            - name: gvmd-storage
              mountPath: /mnt
              subPath: data-objects/gvmd
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: gpg-data
          image: registry.community.greenbone.net/community/gpg-data
          imagePullPolicy: Always
          volumeMounts:
            - name: openvas-storage
              mountPath: /mnt
              # becomes /etc/openvas/gnupg (GNUPGHOME) in openvasd/ospd-openvas
              subPath: gnupg
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: vulnerability-tests
          image: registry.community.greenbone.net/community/vulnerability-tests
          imagePullPolicy: Always
          env:
            - name: FEED_RELEASE
              value: "{{ .Values.FEED_RELEASE }}"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt
              subPath: vt-data
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: configure-openvas
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          imagePullPolicy: Always
          volumeMounts:
            - name: openvas-storage
              mountPath: /mnt
            - name: shared-storage
              mountPath: /var/log/openvas
              subPath: openvas-log-data
          {{- $notusPort := splitList ":" .Values.openvasd.listening | last }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cat > /mnt/openvas.conf <<'EOF'
              table_driven_lsc = yes
              notus_url = http://127.0.0.1:{{ $notusPort }}/notus
              {{- range $key, $value := .Values.openvasConf }}
              {{ $key }} = {{ $value }}
              {{- end }}
              EOF
              sed "s/127/{{ .Values.logLevel }}/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
              chmod 644 /mnt/openvas.conf /mnt/openvas_log.conf
              touch /var/log/openvas/openvas.log
              chmod 666 /var/log/openvas/openvas.log
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

      containers:
        - name: redis-server
          image: registry.community.greenbone.net/community/redis-server
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-storage
              mountPath: /run/redis
              subPath: redis-socket
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}
          {{- include "openvas.resources" (dict "root" . "name" "redis-server") | nindent 10 }}

        - name: pg-gvm
          image: {{ .Values.psgvm.image.repository }}:{{ .Values.psgvm.image.tag }}
          imagePullPolicy: Always
          volumeMounts:
            - name: psql-storage
              mountPath: /var/lib/postgresql
            - name: shared-storage
              mountPath: /var/run/postgresql
              subPath: psql-socket
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}
          {{- include "openvas.resources" (dict "root" . "name" "pg-gvm") | nindent 10 }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "chown -R postgres:postgres /var/lib/postgresql"]

        - name: gvmd
          image: registry.community.greenbone.net/community/gvmd:stable
          imagePullPolicy: Always
          volumeMounts:
            - name: gvmd-storage
              mountPath: /var/lib/gvm
            - name: shared-storage
              mountPath: /var/lib/openvas/plugins
              subPath: vt-data
            - name: psql-storage
              mountPath: /var/lib/postgresql
            - name: gvmd-socket
              mountPath: /run/gvmd
            - name: shared-storage
              mountPath: /run/ospd
              subPath: ospd-openvas-socket
            - name: shared-storage
              mountPath: /var/run/postgresql
              subPath: psql-socket
          {{- with .Values.gvmd }}
          {{- if .existingSecret }}
          envFrom:
          - secretRef:
              name: {{ .existingSecret }}
              optional: false
          {{- end }}

          {{- if .env }}
          env:
            {{- range $key, $value := .env }}
            {{- if $value }}
            - name: "{{ $key }}"
              value: |-
                {{ $value }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}
          {{- include "openvas.resources" (dict "root" . "name" "gvmd") | nindent 10 }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "chown -R gvmd:gvmd /run/gvmd; mkdir -p /var/lib/gvm/gvmd; chown -R gvmd:gvmd /var/lib/gvm"]

        - name: gsa
          image: registry.community.greenbone.net/community/gsa:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 9392
              protocol: TCP
          volumeMounts:
            - name: gvmd-socket
              mountPath: /run/gvmd
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}
          {{- include "openvas.resources" (dict "root" . "name" "gsa") | nindent 10 }}

        - name: openvas
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          imagePullPolicy: Always
          volumeMounts:
            - name: openvas-storage
              mountPath: /etc/openvas
            - name: shared-storage
              mountPath: /var/log/openvas
              subPath: openvas-log-data
          command: ["/bin/sh", "-c", "cat /etc/openvas/openvas.conf && tail -f /var/log/openvas/openvas.log"]
          securityContext:
            {{- include "openvas.logSecurityContext" . | nindent 12 }}
          {{- include "openvas.resources" (dict "root" . "name" "openvas") | nindent 10 }}

        - name: openvasd
          image: registry.community.greenbone.net/community/openvas-scanner:stable
          imagePullPolicy: Always
          env:
            - name: OPENVASD_MODE
              value: "service_notus"
            - name: GNUPGHOME
              value: "/etc/openvas/gnupg"
            - name: LISTENING
              value: {{ .Values.openvasd.listening | quote }}
          volumeMounts:
            - name: openvas-storage
              mountPath: /etc/openvas
            - name: shared-storage
              mountPath: /var/log/openvas
              subPath: openvas-log-data
            - name: shared-storage
              mountPath: /var/lib/notus
              subPath: notus-data
            - name: shared-storage
              mountPath: /var/lib/openvas/plugins
              subPath: vt-data
          {{- include "openvas.resources" (dict "root" . "name" "openvasd") | nindent 10 }}
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}

        - name: ospd-openvas
          image: {{ .Values.ospd.image.repository }}:{{ .Values.ospd.image.tag }}
          imagePullPolicy: Always
          securityContext:
            {{- include "openvas.ospdSecurityContext" . | nindent 12 }}
          env:
            - name: GNUPGHOME
              value: "/etc/openvas/gnupg"
          command: ["ospd-openvas", "-f", "--config", "/etc/gvm/ospd-openvas.conf", "--notus-feed-dir", "/var/lib/notus/advisories", "-m", "666"]
          volumeMounts:
            - name: shared-storage
              mountPath: /var/lib/openvas/plugins
              subPath: vt-data
            - name: shared-storage
              mountPath: /var/lib/notus
              subPath: notus-data
            - name: shared-storage
              mountPath: /run/ospd
              subPath: ospd-openvas-socket
            - name: shared-storage
              mountPath: /run/redis
              subPath: redis-socket
            - name: openvas-storage
              mountPath: /etc/openvas/
            - name: shared-storage
              mountPath: /var/log/openvas
              subPath: openvas-log-data
          {{- with (.Values.ospdOpenvas.resources | default (get (default dict .Values.resources) "ospd-openvas")) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        {{- if .Values.gvmTools.enabled }}
        - name: gvm-tools
          image: registry.community.greenbone.net/community/gvm-tools
          imagePullPolicy: Always
          volumeMounts:
            - name: gvmd-socket
              mountPath: /run/gvmd
            - name: shared-storage
              mountPath: /run/ospd
              subPath: ospd-openvas-socket
          args:
            - gosu gvm /bin/bash; while true; do sleep 600; done
          command:
            - sh
            - '-c'
          securityContext:
            {{- include "openvas.containerSecurityContext" . | nindent 12 }}
          {{- include "openvas.resources" (dict "root" . "name" "gvm-tools") | nindent 10 }}
        {{- end }}

      volumes:
        - name: shared-storage
          emptyDir: {}
        - name: gvmd-storage
          persistentVolumeClaim:
            claimName: gvmd-pvc
        - name: openvas-storage
          persistentVolumeClaim:
            claimName: openvas-pvc
        - name: psql-storage
          persistentVolumeClaim:
            claimName: psql-pvc
        - name: init-scripts
          configMap:
            name: init-scripts-config
            defaultMode: 0755
        - name: gvmd-socket
          emptyDir: {}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
